name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public.py
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TELEGRAM_BOT_TOKEN: PRICE_HUNTER_SECRET_CANARY
          TELEGRAM_CHAT_ID: PRICE_HUNTER_CHAT_CANARY
      - run: python scripts/check_public.py
        env:
          TELEGRAM_BOT_TOKEN: PRICE_HUNTER_SECRET_CANARY
          TELEGRAM_CHAT_ID: PRICE_HUNTER_CHAT_CANARY
